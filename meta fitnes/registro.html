<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Fitness - Registrarse</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark">
    <div class="form-container">
        <h1 class="form-title text-green">Registrarse</h1>
        <form id="registerForm" class="box-form">
            <div class="input-group">
                <label>Nombre:</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>Apellido:</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>Fecha de Nacimiento:</label>
                <input type="date" required>
            </div>
            <div class="input-group">
                <label>Número de Teléfono:</label>
                <input type="tel" required>
            </div>
            <div class="input-group">
                <label>Correo:</label>
                <input type="email" required>
            </div>
            <button type="submit" class="btn-green full-width">Registrar</button>
        </form>
        <p style="text-align:center; margin-top:20px;"><a href="index.html" class="link-white">Volver al inicio</a></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
