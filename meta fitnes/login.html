<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Fitness - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark">
    <div class="form-container">
        <h1 class="form-title text-green">INICIAR SESIÓN</h1>
        <form id="loginForm" class="box-form">
            <div class="input-group">
                <label>Nombre de Usuario:</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label>Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-green full-width">Ingresar</button>
        </form>
        <p style="text-align:center; margin-top:20px;"><a href="index.html" class="link-white">Volver al inicio</a></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
