<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Fitness - Calculadora de Calorías</title>
    <link rel="stylesheet" href="calorias.css">
</head>
<body>

    <header>
        <div class="logo">META <span>FITNESS</span></div>
        
        <button class="hamburger" id="hamburger-btn" aria-label="Abrir menú">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <nav id="nav-menu">
            <ul>
                <li><a href="home.html">INICIO</a></li>
                <li><a href="crear-rutinas.html">CREAR RUTINAS</a></li>
                <li><a href="calorias.html" class="active">CALORÍAS</a></li>
                <li><a href="#" id="logout-btn">CERRAR SESIÓN</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>CALCULADORA DE CALORÍAS</h2>

        <form id="calorias-form">
            <div class="form-group">
                <label for="genero">GÉNERO</label>
                <select id="genero" required>
                    <option value="hombre">Hombre</option>
                    <option value="mujer">Mujer</option>
                </select>
            </div>

            <div class="form-group">
                <label for="edad">EDAD (Años)</label>
                <input type="number" id="edad" placeholder="Ej: 22" min="10" max="100" required>
            </div>

            <div class="form-group">
                <label for="peso">PESO (kg)</label>
                <input type="number" id="peso" placeholder="Ej: 75" step="0.1" min="30" required>
            </div>

            <div class="form-group">
                <label for="altura">ALTURA (cm)</label>
                <input type="number" id="altura" placeholder="Ej: 175" min="100" required>
            </div>

            <div class="form-group">
                <label for="actividad">NIVEL DE ACTIVIDAD</label>
                <select id="actividad" required>
                    <option value="1.2">Sedentario (Poco o ningún ejercicio)</option>
                    <option value="1.375">Ligero (Ejercicio 1-3 días/semana)</option>
                    <option value="1.55">Moderado (Ejercicio 3-5 días/semana)</option>
                    <option value="1.725">Fuerte (Ejercicio 6-7 días/semana)</option>
                </select>
            </div>

            <button type="submit" class="btn-principal">CALCULAR</button>
        </form>

        <div id="resultado-calorias" class="resultado"></div>
    </main>

    <script src="main.js"></script>
</body>
</html>
